<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mango</title>
    <meta name="description" content="A">
    <meta property="og:site_name" content="Mango">
    <meta property="og:title" content="Mango">
    <meta property="og:type" content="website">
    <meta property="og:description" content="A">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;1,400&family=Unbounded:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            font-size: 14pt;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-width: 320px;
            overflow-x: hidden;
            word-wrap: break-word;
            background-color: #F2E1CF;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.051) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.051) 1px, transparent 1px),
                linear-gradient(212deg, #F2E8C9 0%, #F2D9D5 100%);
            background-size: 31px 31px, 31px 31px, auto;
            background-position: center, center, 0% 0%;
            background-attachment: fixed;
            color: rgba(0, 0, 0, 0.69);
            font-family: 'Space Mono', monospace;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------- Intro overlay ---------- */
        #introOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #introVideo {
            width: 320px;
            max-width: 90vw;
            max-height: 90vh;
        }

        /* ---------- Layout ---------- */
        .site-wrapper {
            width: 100%;
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
            animation: fadeIn 1s ease 0.3s both;
        }

        .site-main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .inner {
            width: 38rem;
            max-width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        /* ---------- Hero ---------- */
        .hero {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 6.125rem;
            height: 6.125rem;
            border-radius: 50%;
            border: 3px solid #4F4F4F;
            box-shadow: 0.265rem 0.265rem 0 0 #4F4F4F;
            object-fit: cover;
            background: #FEFCF2;
        }

        .hero h1 {
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 1.75em;
            line-height: 1.375;
            text-transform: uppercase;
            letter-spacing: -0.04375rem;
            color: rgba(0, 0, 0, 0.69);
        }

        .hero p {
            margin: 0;
            font-size: 1em;
            line-height: 1.5;
        }

        /* ---------- Cards ---------- */
        .card {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 2rem;
            border: 3px solid #4F4F4F;
            border-radius: 1rem;
            box-shadow: 0.265rem 0.265rem 0 0 #4F4F4F;
            gap: 1rem;
        }

        .card .text {
            flex: 0 0 80%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card .icon-wrap {
            flex: 0 0 20%;
            display: flex;
            justify-content: flex-end;
        }

        .card h2 {
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 1.25em;
            line-height: 1.375;
            text-transform: uppercase;
            letter-spacing: -0.04375rem;
        }

        .card p {
            margin: 0;
            font-size: 1em;
            line-height: 1.5;
        }

        .card.yellow {
            background-image: linear-gradient(45deg, #FDDC2D 0%, #FFE55C 60%);
            color: rgba(0, 0, 0, 0.69);
        }

        .card.blue {
            background-image: linear-gradient(45deg, #2B46FE 0%, #546AFF 60%);
            color: rgba(255, 255, 255, 0.859);
        }

        .card.pink {
            background-image: linear-gradient(45deg, #FD5176 0%, #FF708F 60%);
            color: rgba(255, 255, 255, 0.859);
        }

        .card.green {
            background-image: linear-gradient(45deg, #09CE9C 0%, #27E3B3 60%);
            color: rgba(255, 255, 255, 0.859);
        }

        /* ---------- Icon buttons ---------- */
        .icon-btn {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            background: #FEFCF2;
            border: 2px solid #4F4F4F;
            box-shadow: 0.265rem 0.265rem 0 0 #4F4F4F;
            text-decoration: none;
            color: #4F4F4F;
            transition: transform 0.25s ease, background-color 0.25s ease;
        }

        .icon-btn svg {
            width: 60%;
            height: 60%;
            fill: #4F4F4F;
            pointer-events: none;
        }

        .icon-btn:hover {
            transform: translateY(-4px);
        }

        .icon-btn:focus-visible {
            outline: 3px solid #4F4F4F;
            outline-offset: 3px;
        }

        .footer-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.25rem;
            margin-top: 0.5rem;
        }

        .footer-icons .icon-btn {
            width: 3.5rem;
            height: 3.5rem;
        }

        .credits {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: rgba(152, 61, 47, 0.502);
        }

        .credits a {
            color: inherit;
        }

        /* ---------- Entrance animation ---------- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(1rem); }
            to   { opacity: 1; transform: none; }
        }

        .card {
            animation: fadeIn 0.8s ease both;
        }

        .card:nth-child(1) { animation-delay: 0.4s; }
        .card:nth-child(2) { animation-delay: 0.55s; }
        .card:nth-child(3) { animation-delay: 0.7s; }
        .card:nth-child(4) { animation-delay: 0.85s; }

        /* ---------- Mobile ---------- */
        @media (max-width: 736px) {
            html {
                font-size: 12pt;
            }

            .inner {
                padding: 1.5rem;
                gap: 1.5rem;
            }

            .card {
                flex-direction: column;
                text-align: center;
                padding: 1.5rem;
            }

            .card .text {
                flex: none;
                width: 100%;
                align-items: center;
            }

            .card .icon-wrap {
                flex: none;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            html {
                font-size: 11pt;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
